
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f9ff">
  <title>Build APK — FortechDev</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="brand" href="index.html">
        <span class="brand-icon"><i data-lucide="layers"></i></span>
        <span>Fortech<span class="blue">Dev</span></span>
      </a>
      <button class="icon-btn" type="button" id="helpBtn" aria-label="Bantuan">
        <i data-lucide="circle-help"></i>
      </button>
    </header>

    <section class="hero">
      <span class="eyebrow"><i data-lucide="sparkles"></i> WEB2APK STUDIO</span>
      <h1>Website jadi <span class="blue">aplikasi.</span></h1>
      <p>Bangun aplikasi Android dari website kamu dengan mudah.</p>
    </section>

    <section class="panel">
      <div class="section-heading">
        <span class="section-icon"><i data-lucide="smartphone"></i></span>
        <div>
          <h2>Build aplikasi</h2>
          <p>Atur informasi dan sumber aplikasi.</p>
        </div>
      </div>

      <form id="buildForm" enctype="multipart/form-data">
        <label for="appName">Nama aplikasi *</label>
        <input id="appName" name="appName" required maxlength="60"
               placeholder="Contoh: Aplikasi Saya">

        <label for="packageName">Package name *</label>
        <input id="packageName" name="packageName" required
               placeholder="com.fortech.aplikasi"
               pattern="[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+">

        <label for="sourceType">Sumber aplikasi</label>
        <select id="sourceType">
          <option value="url">Website online (URL)</option>
          <option value="html">File HTML (offline)</option>
        </select>

        <div id="urlGroup">
          <label for="url">URL website *</label>
          <input id="url" name="url" type="url"
                 placeholder="https://example.com">
        </div>

        <div id="htmlGroup" hidden>
          <label for="html">File HTML *</label>
          <input id="html" name="html" type="file" accept=".html,text/html">
        </div>

        <label for="zip">File ZIP (opsional)</label>
        <input id="zip" name="zip" type="file" accept=".zip">

        <label for="icon">Ikon aplikasi PNG (opsional)</label>
        <input id="icon" name="icon" type="file" accept=".png,image/png">

        <label for="splashType">Splash screen</label>
        <select id="splashType" name="splashType">
          <option value="default">Default</option>
          <option value="image">Gambar</option>
          <option value="html">HTML</option>
          <option value="video">Video</option>
        </select>

        <div id="splashImageGroup" hidden>
          <label for="splash">Gambar splash PNG/JPG</label>
          <input id="splash" name="splash" type="file"
                 accept=".png,.jpg,.jpeg,image/png,image/jpeg">
        </div>

        <div id="splashHtmlGroup" hidden>
          <label for="splashHtml">File splash HTML</label>
          <input id="splashHtml" name="splashHtml" type="file" accept=".html,text/html">
        </div>

        <div id="splashVideoGroup" hidden>
          <label for="splashVideo">Video splash MP4</label>
          <input id="splashVideo" name="splashVideo" type="file" accept=".mp4,video/mp4">
        </div>

        <label for="orientation">Orientasi layar</label>
        <select id="orientation" name="orientation">
          <option value="auto">Otomatis</option>
          <option value="portrait">Portrait</option>
          <option value="landscape">Landscape</option>
        </select>

        <div class="two-cols">
          <div>
            <label for="versionName">Versi</label>
            <input id="versionName" name="versionName" value="1.0">
          </div>
          <div>
            <label for="versionCode">Kode versi</label>
            <input id="versionCode" name="versionCode" type="number" min="1" value="1">
          </div>
        </div>

        <button class="primary-btn" type="submit" id="buildBtn">
          <i data-lucide="rocket"></i>
          <span>Build APK</span>
        </button>
      </form>

      <div id="buildStatus" class="status" hidden aria-live="polite"></div>
      <div id="buildResult" class="result" hidden></div>
    </section>

    <nav class="bottom-nav" aria-label="Navigasi utama">
      <a class="nav-item active" href="index.html">
        <i data-lucide="rocket"></i><span>Build</span>
      </a>
      <a class="nav-item" href="tools.html">
        <i data-lucide="wrench"></i><span>Tools</span>
      </a>
      <a class="nav-item" href="pricing.html">
        <i data-lucide="gem"></i><span>Akses</span>
      </a>
      <a class="nav-item" href="akun.html">
        <i data-lucide="user-round"></i><span>Akun</span>
      </a>
    </nav>
  </main>

  <script>
    lucide.createIcons();

    const sourceType = document.getElementById("sourceType");
    const urlGroup = document.getElementById("urlGroup");
    const htmlGroup = document.getElementById("htmlGroup");
    const urlInput = document.getElementById("url");
    const htmlInput = document.getElementById("html");

    function updateSource() {
      const offline = sourceType.value === "html";
      urlGroup.hidden = offline;
      htmlGroup.hidden = !offline;
      urlInput.required = !offline;
      htmlInput.required = offline;
    }

    sourceType.addEventListener("change", updateSource);
    updateSource();

    const splashType = document.getElementById("splashType");
    const splashGroups = {
      image: document.getElementById("splashImageGroup"),
      html: document.getElementById("splashHtmlGroup"),
      video: document.getElementById("splashVideoGroup")
    };

    function updateSplash() {
      Object.entries(splashGroups).forEach(([type, element]) => {
        element.hidden = splashType.value !== type;
      });
    }

    splashType.addEventListener("change", updateSplash);
    updateSplash();

    document.getElementById("helpBtn").addEventListener("click", () => {
      alert("Isi nama aplikasi, package name, lalu pilih URL website atau file HTML. Pastikan APIKEYYRF sudah diatur di Vercel.");
    });

    document.getElementById("buildForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const form = event.currentTarget;
      const button = document.getElementById("buildBtn");
      const status = document.getElementById("buildStatus");
      const result = document.getElementById("buildResult");

      status.hidden = false;
      result.hidden = true;
      status.textContent = "Sedang mengirim permintaan build...";
      button.disabled = true;

      try {
        const data = new FormData(form);
        if (sourceType.value === "url") data.delete("html");
        else data.delete("url");

        const response = await fetch("/api/build", {
          method: "POST",
          body: data
        });

        const payload = await response.json();

        if (!response.ok || payload.success === false) {
          throw new Error(payload.error || "Build gagal.");
        }

        status.textContent = "Build berhasil!";
        result.hidden = false;
        result.replaceChildren();

        const heading = document.createElement("h3");
        heading.textContent = payload.fileName || "APK siap diunduh";
        result.appendChild(heading);

        if (payload.size) {
          const size = document.createElement("p");
          size.textContent = "Ukuran: " + (payload.size / 1024 / 1024).toFixed(2) + " MB";
          result.appendChild(size);
        }

        if (payload.downloadUrl) {
          const link = document.createElement("a");
          link.href = payload.downloadUrl;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.className = "primary-btn";
          link.textContent = "Unduh APK";
          result.appendChild(link);
        } else {
          result.appendChild(document.createTextNode("Respons tidak menyertakan URL unduhan."));
        }
      } catch (error) {
        status.textContent = error.message || "Gagal menghubungi API Builder.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
